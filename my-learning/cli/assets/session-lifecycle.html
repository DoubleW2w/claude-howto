<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code CLI · 会话生命周期</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #08080e;
    --bg-surface: #11111b;
    --border: #252535;
    --text-primary: #ddd9d0;
    --text-secondary: #78766f;
    --text-dim: #4a4842;
    --accent-continue: #f0b050;
    --accent-resume: #50a8f0;
    --accent-fork: #70c850;
    --glow-continue: rgba(240, 176, 80, 0.45);
    --glow-resume: rgba(80, 168, 240, 0.40);
    --glow-fork: rgba(112, 200, 80, 0.40);
    --font-mono: 'Cascadia Code', 'Cascadia Mono', 'Consolas', 'SF Mono', 'Monaco', 'Courier New', monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Subtle noise overlay via layered backgrounds */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(240,176,80,0.025) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 70%, rgba(80,168,240,0.02) 0%, transparent 70%),
      radial-gradient(ellipse 30% 40% at 20% 60%, rgba(112,200,80,0.015) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---- Header ---- */
  .header {
    text-align: center;
    padding: 28px 0 8px;
    flex-shrink: 0;
  }
  .header h1 {
    font-family: var(--font-mono);
    font-size: 1.05rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--text-primary);
  }
  .header h1 span {
    color: var(--text-dim);
  }
  .header p {
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-top: 4px;
    letter-spacing: 0.03em;
  }

  /* ---- Canvas ---- */
  .canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .canvas-wrap svg {
    width: 100%;
    height: 100%;
    max-height: 60vh;
  }

  /* ---- Command bar ---- */
  .cmd-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 0 4px;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .cmd-bar .prompt {
    color: var(--text-dim);
  }
  .cmd-bar .command {
    color: var(--text-primary);
    transition: color 0.4s ease;
    min-width: 320px;
    text-align: left;
  }
  .cmd-bar .cursor {
    display: inline-block;
    width: 8px;
    height: 1.05em;
    background: var(--text-primary);
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- Tabs ---- */
  .tabs {
    flex-shrink: 0;
    display: flex;
    gap: 2px;
    padding: 12px 0 32px;
    justify-content: center;
  }
  .tab {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    padding: 10px 22px;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 0.03em;
    position: relative;
    outline: none;
  }
  .tab:first-child { border-radius: 6px 0 0 6px; }
  .tab:last-child { border-radius: 0 6px 6px 0; }
  .tab:only-child { border-radius: 6px; }
  .tab:hover {
    color: var(--text-primary);
    border-color: #3a3a4a;
    background: #181827;
  }
  .tab.active {
    color: #fff;
    background: #1c1c2e;
    border-color: #3e3e52;
    box-shadow: 0 0 18px rgba(240,176,80,0.08);
  }
  .tab .tab-icon {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    position: relative;
    top: -1px;
  }
  .tab[data-action="continue"] .tab-icon { background: var(--accent-continue); }
  .tab[data-action="resume"]  .tab-icon { background: var(--accent-resume); }
  .tab[data-action="fork"]    .tab-icon { background: var(--accent-fork); }

  /* ---- SVG Elements ---- */
  .grid-line {
    stroke: rgba(255,255,255,0.018);
    stroke-width: 0.5;
    vector-effect: non-scaling-stroke;
  }

  /* Nodes */
  .node-group { cursor: default; }
  .node-circle {
    fill: #141420;
    stroke: #2e2e3f;
    stroke-width: 1.5;
    transition: stroke 0.5s ease, fill 0.5s ease;
  }
  .node-text {
    fill: #a09d95;
    font-family: var(--font-ui);
    font-size: 14px;
    text-anchor: middle;
    dominant-baseline: central;
    transition: fill 0.5s ease;
    user-select: none;
  }
  .node-sub {
    fill: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 10px;
    text-anchor: middle;
    transition: fill 0.5s ease;
    user-select: none;
  }

  /* Edges */
  .edge {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
  }

  /* Command labels on canvas */
  .cmd-label {
    font-family: var(--font-mono);
    font-size: 11px;
    fill: var(--text-dim);
    text-anchor: middle;
    transition: fill 0.5s ease, opacity 0.4s ease;
    user-select: none;
  }

  /* Ripple ring for continue pulse */
  .ripple {
    fill: none;
    stroke: var(--accent-continue);
    stroke-width: 1.5;
    opacity: 0;
  }

  /* ============ STATE-DRIVEN ANIMATIONS ============ */

  /* --- Idle (no state) --- */
  .node-resume, .node-fork,
  .edge-resume, .edge-fork,
  .cmd-resume, .cmd-fork,
  .ripple { display: none; }

  [data-state] .node-resume, [data-state] .node-fork { display: block; }

  /* --- CONTINUE --- */
  [data-state="continue"] .node-center .node-circle {
    stroke: var(--accent-continue);
    animation: continue-glow 2s ease-in-out;
  }
  [data-state="continue"] .node-center .node-text {
    fill: #f0d090;
    animation: continue-glow 2s ease-in-out;
  }
  [data-state="continue"] .node-center .node-sub {
    fill: var(--accent-continue);
    transition: fill 0.3s ease;
  }
  [data-state="continue"] .edge-continue {
    display: block;
    stroke: var(--accent-continue);
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: draw-edge 1s 0.15s ease-out forwards;
  }
  [data-state="continue"] .cmd-continue {
    fill: var(--accent-continue);
    opacity: 1;
    transition: fill 0.4s ease, opacity 0.4s ease;
  }
  [data-state="continue"] .ripple {
    display: block;
    animation: ripple-out 1.5s 0.1s ease-out;
  }
  [data-state="continue"] .cmd-bar .command { color: var(--accent-continue); }

  /* --- RESUME --- */
  [data-state="resume"] .node-center .node-circle {
    stroke: #3a3a4f;
    fill: #10101c;
  }
  [data-state="resume"] .node-center .node-text { fill: #6a6760; }
  [data-state="resume"] .node-center .node-sub { fill: #4a4842; }
  [data-state="resume"] .node-resume {
    display: block;
    animation: node-materialize 0.5s 0.2s ease-out both;
    transform-origin: 616px 240px;
  }
  [data-state="resume"] .node-resume .node-circle { stroke: var(--accent-resume); fill: #101825; }
  [data-state="resume"] .node-resume .node-text { fill: #90c8f0; }
  [data-state="resume"] .node-resume .node-sub { fill: var(--accent-resume); }
  [data-state="resume"] .edge-resume {
    display: block;
    stroke: var(--accent-resume);
    stroke-dasharray: 160;
    stroke-dashoffset: 160;
    animation: draw-edge 0.7s 0.25s ease-out forwards;
  }
  [data-state="resume"] .cmd-resume {
    fill: var(--accent-resume);
    opacity: 1;
    transition: fill 0.4s ease, opacity 0.4s ease 0.3s;
  }
  [data-state="resume"] .cmd-bar .command { color: var(--accent-resume); }

  /* --- FORK --- */
  [data-state="fork"] .node-center .node-circle {
    stroke: var(--accent-fork);
  }
  [data-state="fork"] .node-center .node-text { fill: #c0e0a0; }
  [data-state="fork"] .node-center .node-sub { fill: var(--accent-fork); }
  [data-state="fork"] .node-fork {
    display: block;
    animation: node-branch 0.55s 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    transform-origin: 616px 395px;
  }
  [data-state="fork"] .node-fork .node-circle { stroke: var(--accent-fork); fill: #101c14; }
  [data-state="fork"] .node-fork .node-text { fill: #a0d890; }
  [data-state="fork"] .node-fork .node-sub { fill: var(--accent-fork); }
  [data-state="fork"] .edge-fork {
    display: block;
    stroke: var(--accent-fork);
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    animation: draw-edge 0.7s 0.3s ease-out forwards;
  }
  [data-state="fork"] .cmd-fork {
    fill: var(--accent-fork);
    opacity: 1;
    transition: fill 0.4s ease, opacity 0.4s ease 0.3s;
  }
  [data-state="fork"] .cmd-bar .command { color: var(--accent-fork); }

  /* ============ KEYFRAMES ============ */
  @keyframes continue-glow {
    0%   { filter: drop-shadow(0 0 4px var(--glow-continue)); }
    30%  { filter: drop-shadow(0 0 24px var(--glow-continue)); }
    60%  { filter: drop-shadow(0 0 12px var(--glow-continue)); }
    80%  { filter: drop-shadow(0 0 22px var(--glow-continue)); }
    100% { filter: drop-shadow(0 0 8px var(--glow-continue)); }
  }

  @keyframes ripple-out {
    0%   { r: 42; opacity: 0.7; stroke-width: 2; }
    100% { r: 85; opacity: 0; stroke-width: 0.3; }
  }

  @keyframes draw-edge {
    to { stroke-dashoffset: 0; }
  }

  @keyframes node-materialize {
    0%   { opacity: 0; transform: scale(0.3); }
    60%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes node-branch {
    0%   { opacity: 0; transform: translate(-20px, -20px) scale(0); }
    70%  { opacity: 1; transform: translate(0, 0) scale(1.06); }
    100% { opacity: 1; transform: translate(0, 0) scale(1); }
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 640px) {
    .header h1 { font-size: 0.9rem; }
    .tab { padding: 8px 14px; font-size: 0.65rem; }
    .cmd-bar .command { min-width: 220px; font-size: 0.72rem; }
    .cmd-bar { font-size: 0.72rem; }
  }
</style>
</head>
<body>

<div class="app" id="app" data-state="continue">

  <!-- Header -->
  <header class="header">
    <h1>Claude Code CLI <span>· 会话生命周期</span></h1>
    <p>Session State Machine &mdash; 点击下方标签查看三种状态转换</p>
  </header>

  <!-- SVG Canvas -->
  <div class="canvas-wrap">
    <svg viewBox="0 0 800 530" xmlns="http://www.w3.org/2000/svg">

      <defs>
        <!-- Grid pattern -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" class="grid-line"/>
        </pattern>

        <!-- Arrowhead markers (explicit colors for cross-browser marker rendering) -->
        <marker id="arrow-continue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <polygon points="0 0, 9 3.5, 0 7" fill="#f0b050"/>
        </marker>
        <marker id="arrow-resume" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <polygon points="0 0, 9 3.5, 0 7" fill="#50a8f0"/>
        </marker>
        <marker id="arrow-fork" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <polygon points="0 0, 9 3.5, 0 7" fill="#70c850"/>
        </marker>

        <!-- Glow filters -->
        <filter id="glow-continue" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-resume" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-fork" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Grid background -->
      <rect width="800" height="530" fill="url(#grid)"/>

      <!-- === EDGES === -->

      <!-- Continue: self-loop above center node -->
      <path class="edge edge-continue"
        d="M 400,193 C 320,120 330,48 400,62 C 470,76 465,130 432,198"
        marker-end="url(#arrow-continue)"/>

      <!-- Resume: arrow from center to resume target -->
      <path class="edge edge-resume"
        d="M 446,240 L 570,240"
        marker-end="url(#arrow-resume)"/>

      <!-- Fork: curved branch from center to fork target -->
      <path class="edge edge-fork"
        d="M 432,270 C 462,340 520,380 570,395"
        marker-end="url(#arrow-fork)"/>

      <!-- === NODES === -->

      <!-- Center node: 会话 -->
      <g class="node-group node-center">
        <circle class="node-circle" cx="400" cy="240" r="46"/>
        <text class="node-text" x="400" y="240">会话</text>
        <text class="node-sub" x="400" y="302">last-session</text>
      </g>

      <!-- Ripple ring (continue animation) -->
      <circle class="ripple" cx="400" cy="240" r="46"/>

      <!-- Resume target node -->
      <g class="node-group node-resume">
        <circle class="node-circle" cx="616" cy="240" r="42"/>
        <text class="node-text" x="616" y="240">name</text>
        <text class="node-sub" x="616" y="296">named-session</text>
      </g>

      <!-- Fork target node -->
      <g class="node-group node-fork">
        <circle class="node-circle" cx="616" cy="395" r="42"/>
        <text class="node-text" x="616" y="395">abc</text>
        <text class="node-sub" x="616" y="451">fork-session</text>
      </g>

      <!-- === COMMAND LABELS ON CANVAS === -->
      <text class="cmd-label cmd-continue" x="400" y="34" opacity="0">claude -c</text>
      <text class="cmd-label cmd-resume" x="530" y="226" opacity="0">claude -r "name"</text>
      <text class="cmd-label cmd-fork" x="508" y="340" opacity="0">claude --resume abc --fork-session</text>

    </svg>
  </div>

  <!-- Command bar -->
  <div class="cmd-bar">
    <span class="prompt">$</span>
    <span class="command">claude -c</span>
    <span class="cursor"></span>
  </div>

  <!-- Tab controls -->
  <nav class="tabs">
    <button class="tab active" data-action="continue">
      <span class="tab-icon"></span>继续
    </button>
    <button class="tab" data-action="resume">
      <span class="tab-icon"></span>恢复
    </button>
    <button class="tab" data-action="fork">
      <span class="tab-icon"></span>分支
    </button>
  </nav>

</div>

<script>
(function() {
  var app = document.getElementById('app');
  var tabs = document.querySelectorAll('.tab');
  var cmdEl = document.querySelector('.cmd-bar .command');

  var commands = {
    continue: 'claude -c',
    resume: 'claude -r "name"',
    fork: 'claude --resume abc --fork-session'
  };

  function setState(state) {
    // Remove state to allow re-trigger
    app.removeAttribute('data-state');
    // Force style recalculation so animations restart
    void app.offsetWidth;
    // Apply new state
    app.setAttribute('data-state', state);
    // Update command display
    cmdEl.textContent = commands[state] || '';
  }

  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      var action = this.dataset.action;
      if (!action) return;

      // Update active tab
      tabs.forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');

      // Trigger state transition
      setState(action);
    });
  });

  // Initial state is already set via HTML data-state attribute.
  // JS only handles tab-driven transitions (click triggers replay-safe animation).
})();
</script>

</body>
</html>
